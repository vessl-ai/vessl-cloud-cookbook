[project]
name = "aqr-finance"
version = "0.1.0"
description = "AQR-style point-in-time financial LLM on VESSL Cloud (Qwen3.5-35B-A3B-Base + LoRA continued pretraining)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "accelerate>=0.34",
    "causal-conv1d>=1.4",
    "datasets>=3.0",
    "flash-linear-attention>=0.2",
    "huggingface_hub>=0.26",
    "kaggle>=1.6",
    "matplotlib>=3.10",
    "numpy>=2.0",
    "pandas>=2.2",
    "peft>=0.13",
    "pyarrow>=18.0",
    "scikit-learn>=1.5",
    "torch==2.9.1",
    "tqdm>=4.66",
    "transformers>=4.46",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
