compute_environment: LOCAL_MACHINE
distributed_type: FSDP
downcast_bf16: 'no'
fsdp_config:
  # TRANSFORMER_BASED_WRAP shards at decoder-layer granularity so each
  # unshard at forward time touches one 40-layer slice (~875 MB) instead
  # of pulling the whole 35B model onto a single GPU. Verified class
  # name via transformers/models/qwen3_5_moe/modeling_qwen3_5_moe.py
  # _no_split_modules (line 3570) and our dry-run stack trace at line 126.
  fsdp_auto_wrap_policy: TRANSFORMER_BASED_WRAP
  fsdp_transformer_layer_cls_to_wrap: Qwen3_5MoeDecoderLayer
  fsdp_backward_prefetch: BACKWARD_PRE
  fsdp_cpu_ram_efficient_loading: true
  fsdp_offload_params: false
  fsdp_sharding_strategy: FULL_SHARD
  # FULL_STATE_DICT (not SHARDED) so PEFT save_pretrained can extract the
  # LoRA adapter weights at the end of train.py. SHARDED is incompatible
  # with PEFT's save path (each rank holds a partial state dict).
  fsdp_state_dict_type: FULL_STATE_DICT
  fsdp_sync_module_states: true
  fsdp_use_orig_params: true
machine_rank: 0
main_training_function: main
mixed_precision: bf16
num_machines: 1
num_processes: 8
rdzv_backend: static
same_network: true
tpu_use_cluster: false
tpu_use_sudo: false
use_cpu: false
